<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fireground AI • Vercel Dashboard</title>
<style>
:root{
  --bg:#06101d;--panel:#0d1a2b;--panel2:#091525;--border:#20334d;
  --text:#edf5ff;--muted:#8191ab;--cyan:#65d9ff;
  --green:#4fe0a2;--amber:#ffd166;--red:#ff6478;
}
*{box-sizing:border-box}
body{
  margin:0;background:radial-gradient(circle at 10% 0%,#102b48 0,#06101d 35%,#050c16 100%);
  color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif
}
.wrap{max-width:1440px;margin:auto;padding:28px}
.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:20px}
.eyebrow{font-size:11px;letter-spacing:.16em;font-weight:800;color:var(--muted)}
h1{margin:7px 0 0;font-size:36px;letter-spacing:-.03em}
h1 span{color:var(--cyan);font-weight:600}
.actions{display:flex;gap:10px;align-items:center}
button{background:#14263f;border:1px solid var(--border);color:var(--text);border-radius:9px;padding:10px 13px;cursor:pointer}
button:hover{border-color:var(--cyan)}
.live{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block}
.card{
  background:linear-gradient(180deg,var(--panel),var(--panel2));
  border:1px solid var(--border);border-radius:16px;
  box-shadow:0 18px 55px rgba(0,0,0,.18)
}
.hero{display:grid;grid-template-columns:1.25fr .75fr 1fr;gap:15px}
.status{padding:22px;min-height:185px}
.label{color:var(--muted);font-size:10px;font-weight:800;letter-spacing:.13em}
.big{font-size:58px;font-weight:900;margin:22px 0 4px}
.normal .big{color:var(--green)} .elevated .big{color:var(--amber)} .high .big{color:var(--red)}
.gauge{padding:20px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring{width:150px;height:150px;border-radius:50%;background:conic-gradient(var(--cyan) var(--p),#1b2d48 0);display:grid;place-items:center;margin-top:10px}
.ring-in{width:111px;height:111px;border-radius:50%;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-in strong{font-size:39px}.ring-in span{font-size:11px;color:var(--muted)}
.meta{padding:21px}.latest{font-size:22px;font-weight:750;margin:17px 0}
.row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);color:var(--muted)}
.row strong{color:var(--text)}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:15px 0}
.stat{padding:17px}.stat strong{display:block;font-size:34px}.stat span{display:block;margin-top:3px;color:var(--muted);font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:800}
.stat.normal strong{color:var(--green)} .stat.elevated strong{color:var(--amber)} .stat.high strong{color:var(--red)}
.panel{padding:22px;margin-top:15px}
.panel-head{display:flex;justify-content:space-between;gap:15px;align-items:flex-end;margin-bottom:17px}
h2{margin:6px 0 0;font-size:21px}
.note{font-size:11px;color:var(--muted)}
.pred-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.pred{padding:15px;border:1px solid var(--border);border-radius:12px;background:#091526;display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center}
.icon{width:40px;height:40px;border-radius:11px;background:#152944;color:var(--cyan);display:grid;place-items:center;font-weight:900}
.pred small{display:block;color:var(--muted);font-size:9px;letter-spacing:.12em;font-weight:800}
.pred strong{display:block;font-size:20px;margin-top:5px}
.conf{color:var(--cyan);font-weight:800;font-size:12px}
.sensor-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.sensor{padding:14px;border:1px solid var(--border);border-radius:12px;background:#091526}
.sensor-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.sensor-name{font-weight:750}.sensor-unit{font-size:10px;color:var(--muted);margin-top:2px}
.sensor-value{font-size:24px;font-weight:850;color:var(--cyan)}
.sensor-meta{font-size:10px;color:var(--muted);margin-top:3px;text-align:right}
.mini{height:135px;margin-top:9px;border:1px solid #1b2a42;border-radius:9px;background:#07111f;overflow:hidden}
.mini svg{width:100%;height:100%;display:block}
.gridline{stroke:#203149;stroke-width:1}.spark{fill:none;stroke:var(--cyan);stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}.point{fill:var(--cyan)}
.chart{padding:10px;background:#07111f;border:1px solid var(--border);border-radius:12px}
.chart svg{display:block;width:100%;height:275px}
.axis{fill:#63738e;font-size:10px}.riskline{fill:none;stroke:var(--cyan);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.bar.normal{fill:rgba(79,224,162,.36)}.bar.elevated{fill:rgba(255,209,102,.38)}.bar.high{fill:rgba(255,100,120,.42)}
.legend{display:flex;gap:15px;color:var(--muted);font-size:11px}.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.legend .n{background:var(--green)}.legend .e{background:var(--amber)}.legend .h{background:var(--red)}
.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:12px;margin-top:10px}
table{border-collapse:collapse;width:100%;min-width:760px}th,td{padding:10px 12px;border-bottom:1px solid var(--border);text-align:left;font-size:12px}
th{font-size:9px;color:var(--muted);letter-spacing:.12em}tr:last-child td{border-bottom:0}
.pill{padding:4px 7px;border-radius:99px;font-weight:800;font-size:10px}.pill.normal{color:var(--green);background:rgba(79,224,162,.09)}.pill.elevated{color:var(--amber);background:rgba(255,209,102,.09)}.pill.high{color:var(--red);background:rgba(255,100,120,.09)}
.map{height:270px;border:1px solid var(--border);border-radius:12px;background:#07111f;position:relative;overflow:hidden}
.map:before,.map:after{content:"";position:absolute;background:#1a2a42}.map:before{left:25%;top:0;bottom:0;width:1px;box-shadow:180px 0 #1a2a42,360px 0 #1a2a42,540px 0 #1a2a42}.map:after{top:25%;left:0;right:0;height:1px;box-shadow:0 65px #1a2a42,0 130px #1a2a42,0 195px #1a2a42}
.marker{position:absolute;width:18px;height:18px;border-radius:50%;background:var(--cyan);box-shadow:0 0 0 8px rgba(101,217,255,.11),0 0 28px rgba(101,217,255,.55);transform:translate(-50%,-50%);z-index:2;cursor:pointer}
.marker.elevated{background:var(--amber);box-shadow:0 0 0 8px rgba(255,209,102,.13),0 0 28px rgba(255,209,102,.55)}
.marker.high{background:var(--red);box-shadow:0 0 0 8px rgba(255,100,120,.15),0 0 28px rgba(255,100,120,.6)}
.marker.selected{outline:3px solid #fff;outline-offset:2px}
.marker-label{position:absolute;top:22px;left:50%;transform:translateX(-50%);font-size:9px;color:var(--text);background:#0d1a2bcc;padding:2px 5px;border-radius:5px;white-space:nowrap;pointer-events:none}
.map-label{position:absolute;left:14px;top:12px;color:var(--muted);font-size:10px;letter-spacing:.1em;font-weight:800;z-index:3}
.map-badge{position:absolute;right:12px;top:12px;padding:7px 9px;background:#101e34;border:1px solid var(--border);border-radius:9px;font-size:11px;z-index:3}

.ff-tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px}
.ff-tab{display:flex;align-items:center;gap:8px;padding:11px 15px;border-radius:12px;border:1px solid var(--border);background:linear-gradient(180deg,var(--panel),var(--panel2));color:var(--text);cursor:pointer;font-size:12px;text-align:left;font-family:inherit}
.ff-tab:hover{border-color:var(--cyan)}
.ff-tab.active{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan) inset}
.ff-tab-name{font-weight:750}
.ff-tab-id{color:var(--muted);font-size:10px}
.ff-dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex-shrink:0}
.ff-dot.normal{background:var(--green)}.ff-dot.elevated{background:var(--amber)}.ff-dot.high{background:var(--red)}
.danger-banner{padding:14px 18px;margin-bottom:15px;border:1px solid var(--red);background:rgba(255,100,120,.07)}
.danger-row{padding:6px 0;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.danger-row strong{color:var(--text)}
footer{display:flex;flex-wrap:wrap;gap:18px;padding:18px 2px 4px;color:var(--muted);font-size:11px}
footer strong{color:var(--text)}

.water-scenario{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
  margin-top:15px;
}
.scenario-card,.hydraulic-card{
  padding:22px;
}
.scenario-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  margin-top:15px;
}
.field label{
  display:block;
  color:var(--muted);
  font-size:9px;
  letter-spacing:.11em;
  font-weight:800;
  margin-bottom:6px;
}
.field input,.field select{
  width:100%;
  background:#07111f;
  color:var(--text);
  border:1px solid var(--border);
  border-radius:9px;
  padding:10px;
  font-size:13px;
  outline:none;
}
.field input:focus,.field select:focus{
  border-color:var(--cyan);
}
.calc-btn{
  width:100%;
  margin-top:12px;
  background:#12304a;
  border-color:#2d5675;
}
.hydraulic-result{
  margin-top:15px;
}
.hydraulic-value{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:10px 0;
  border-bottom:1px solid var(--border);
  font-size:13px;
}
.hydraulic-value span{
  color:var(--muted);
}
.hydraulic-value strong{
  color:var(--text);
  text-align:right;
}
.saved-note{
  margin-top:10px;
  font-size:10px;
  color:var(--muted);
  line-height:1.5;
}
.water-warning{
  margin-top:14px;
  padding:10px 12px;
  border:1px dashed var(--border);
  border-radius:10px;
  color:var(--muted);
  font-size:10px;
  line-height:1.5;
}
@media(max-width:1050px){
  .water-scenario{grid-template-columns:1fr}
}
@media(max-width:740px){
  .scenario-grid{grid-template-columns:1fr}
}

@media(max-width:1050px){.hero{grid-template-columns:1fr}.sensor-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:740px){.wrap{padding:16px}.top{flex-direction:column}.stats{grid-template-columns:repeat(2,1fr)}.pred-grid{grid-template-columns:1fr}.sensor-grid{grid-template-columns:1fr}.big{font-size:46px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">FIREGROUND AI • VNNX • ONLINE DASHBOARD</div>
      <h1>Fireground AI <span>Command Dashboard</span></h1>
    </div>
    <div class="actions">
      <button onclick="location.reload()">Refresh</button>
      <div class="live"><span class="dot"></span> DATA SNAPSHOT</div>
    </div>
  </header>

  <div id="app"></div>
</div>

<script>
let D=null;
let selectedFirefighterId=null;

const esc = v => String(v ?? "").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const statusClass = s => ({NORMAL:"normal",ELEVATED:"elevated",HIGH:"high"}[String(s||"").toUpperCase()]||"normal");
const pct = v => (Number(v||0)*100).toFixed(1)+"%";

function lineSvg(values, width=520, height=135){
  const pad={l:16,r:9,t:10,b:18}, pw=width-pad.l-pad.r, ph=height-pad.t-pad.b;
  const nums=values.map(Number), min=Math.min(...nums), max=Math.max(...nums);
  const range=(max-min)||1;
  const points=nums.map((v,i)=>{
    const x=pad.l+(nums.length===1?pw/2:pw*i/(nums.length-1));
    const y=pad.t+ph-(v-min)/range*ph;
    return [x,y];
  });
  const grid=[0,.5,1].map(t=>`<line class="gridline" x1="${pad.l}" y1="${pad.t+ph*t}" x2="${width-pad.r}" y2="${pad.t+ph*t}"/>`).join("");
  const poly=points.map(p=>p.join(",")).join(" ");
  const last=points[points.length-1];
  return `<svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="none">
    ${grid}<polyline class="spark" points="${poly}"/>
    ${last?`<circle class="point" cx="${last[0]}" cy="${last[1]}" r="3.2"/>`:""}
  </svg>`;
}

function riskSvg(results){
  const W=1050,H=285,L=48,R=22,T=18,B=40,PW=W-L-R,PH=H-T-B,n=results.length||1;
  const scores=results.map(r=>Number(r?.risk?.risk_score||0));
  const pts=[],bars=[],grid=[];
  for(let s=0;s<=5;s++){const y=T+PH-(s/5)*PH;grid.push(`<line class="gridline" x1="${L}" y1="${y}" x2="${W-R}" y2="${y}"/><text class="axis" x="10" y="${y+4}">${s}</text>`);}
  results.forEach((r,i)=>{
    const x=n===1?L+PW/2:L+PW*i/(n-1), score=Math.min(5,scores[i]||0), y=T+PH-score/5*PH;
    const bw=Math.max(2.4,PW/n-1.3), y0=T+PH;
    bars.push(`<rect class="bar ${statusClass(r?.risk?.local_status)}" x="${x-bw/2}" y="${y}" width="${bw}" height="${y0-y}" rx="2"/>`);
    pts.push(`${x},${y}`);
  });
  return `<svg viewBox="0 0 ${W} ${H}">${grid.join("")}${bars.join("")}<polyline class="riskline" points="${pts.join(" ")}"/>
    <text class="axis" x="${L}" y="${H-10}">Window 1</text><text class="axis" x="${W-R-70}" y="${H-10}">Window ${n}</text></svg>`;
}

function sensorCard(ch, stream){
  const vals=(stream||[]).map(r=>r[ch.key]);
  const last=vals[vals.length-1], min=Math.min(...vals), max=Math.max(...vals);
  return `<div class="sensor">
    <div class="sensor-top">
      <div><div class="sensor-name">${esc(ch.name)}</div><div class="sensor-unit">${esc(ch.unit)}</div></div>
      <div><div class="sensor-value">${Number(last).toFixed(ch.key==="heart_rate"||ch.key==="temperature"?2:3)}</div><div class="sensor-meta">latest</div></div>
    </div>
    <div class="mini">${lineSvg(vals)}</div>
    <div class="sensor-meta">min ${min.toFixed(2)} • max ${max.toFixed(2)} • 60 samples</div>
  </div>`;
}


const WATER_SETTINGS_KEY = "fireground_water_settings_v2";

const defaultWaterSettings = {
  hoseDiameter: 65,
  hoseLength: 30,
  nozzleType: "Fog",
  nozzleDiameter: 19,
  elevation: 12,
  dischargeCoeff: 0.98,
  hwC: 140
};

let currentAiFlowLpm = 450;
let currentWaterLevel = "MEDIUM";
let currentDemandIndex = 0;

function getWaterSettings(){
  try{
    const saved = JSON.parse(
      localStorage.getItem(WATER_SETTINGS_KEY) || "{}"
    );

    return {
      ...defaultWaterSettings,
      ...saved
    };
  }catch{
    return {...defaultWaterSettings};
  }
}

function setFieldValue(id, value){
  const el=document.getElementById(id);
  if(el) el.value=value;
}

function numberValue(id){
  const v=Number(document.getElementById(id)?.value);
  return Number.isFinite(v) ? v : 0;
}

function restoreWaterSettings(){

  const s=getWaterSettings();

  setFieldValue("hoseDiameter", s.hoseDiameter);
  setFieldValue("hoseLength", s.hoseLength);
  setFieldValue("nozzleType", s.nozzleType);
  setFieldValue("nozzleDiameter", s.nozzleDiameter);
  setFieldValue("elevation", s.elevation);
  setFieldValue("dischargeCoeff", s.dischargeCoeff);
  setFieldValue("hwC", s.hwC);

  updateWaterCalculation();
}

function saveWaterSettings(){

  const s={
    hoseDiameter:numberValue("hoseDiameter"),
    hoseLength:numberValue("hoseLength"),
    nozzleType:
      document.getElementById("nozzleType")?.value || "Fog",
    nozzleDiameter:numberValue("nozzleDiameter"),
    elevation:numberValue("elevation"),
    dischargeCoeff:numberValue("dischargeCoeff"),
    hwC:numberValue("hwC")
  };

  localStorage.setItem(
    WATER_SETTINGS_KEY,
    JSON.stringify(s)
  );
}

function updateWaterCalculation(){

  const hoseDiameter = numberValue("hoseDiameter");
  const hoseLength = numberValue("hoseLength");
  const nozzleDiameter = numberValue("nozzleDiameter");
  const elevation = numberValue("elevation");
  const cd = numberValue("dischargeCoeff");
  const hwC = numberValue("hwC");

  if(
    hoseDiameter <= 0 ||
    hoseLength < 0 ||
    nozzleDiameter <= 0 ||
    cd <= 0 ||
    hwC <= 0 ||
    currentAiFlowLpm <= 0
  ){
    return;
  }

  const flowLpm = currentAiFlowLpm;

  // ----------------------------------------------------------
  // NOZZLE PRESSURE
  //
  // Q = Cd * A * sqrt(2*DeltaP/rho)
  //
  // Rearranged to obtain pressure.
  // ----------------------------------------------------------

  const rho = 998;
  const g = 9.80665;

  const Q = flowLpm / 1000 / 60;
  const dNozzle = nozzleDiameter / 1000;
  const dHose = hoseDiameter / 1000;

  const area =
    Math.PI * dNozzle * dNozzle / 4;

  const nozzlePressurePa =
    0.5 * rho *
    Math.pow(Q / (cd * area), 2);

  const nozzlePressureBar =
    nozzlePressurePa / 100000;

  // ----------------------------------------------------------
  // HAZEN-WILLIAMS HOSE FRICTION
  //
  // Result is metres of water head.
  // ----------------------------------------------------------

  const hf =
    10.67 *
    hoseLength *
    Math.pow(Q, 1.852)
    /
    (
      Math.pow(hwC, 1.852) *
      Math.pow(dHose, 4.87)
    );

  const frictionPressureBar =
    (rho * g * hf) / 100000;

  // ----------------------------------------------------------
  // ELEVATION LOSS
  // ----------------------------------------------------------

  const elevationPressureBar =
    (rho * g * elevation) / 100000;

  // ----------------------------------------------------------
  // PUMP PRESSURE ESTIMATE
  // ----------------------------------------------------------

  const pumpPressureBar =
    nozzlePressureBar +
    frictionPressureBar +
    elevationPressureBar;

  saveWaterSettings();

  document.getElementById("waterDemandDisplay").textContent =
    currentWaterLevel;

  document.getElementById("demandIndexDisplay").textContent =
    Number(currentDemandIndex).toFixed(1) + " / 100";

  document.getElementById("flowDisplay").textContent =
    flowLpm.toFixed(0) + " L/min";

  const nozzleType =
    document.getElementById("nozzleType")?.value || "Fog";

  document.getElementById("nozzleDisplay").textContent =
    nozzleType +
    " • " +
    nozzleDiameter.toFixed(1) +
    " mm";

  document.getElementById("nozzlePressureDisplay").textContent =
    nozzlePressureBar.toFixed(2) + " bar";

  document.getElementById("frictionDisplay").textContent =
    frictionPressureBar.toFixed(2) + " bar";

  document.getElementById("elevationDisplay").textContent =
    elevationPressureBar.toFixed(2) + " bar";

  document.getElementById("pumpPressureDisplay").textContent =
    pumpPressureBar.toFixed(2) + " bar";
}

function calculateHydraulics(){
  updateWaterCalculation();
}

function firefighterTabs(firefighters){
  const ids=Object.keys(firefighters);
  return `<div class="ff-tabs">${ids.map(id=>{
    const f=firefighters[id];
    const active=id===selectedFirefighterId?"active":"";
    return `<button class="ff-tab ${active}" onclick="selectFirefighter('${id.replace(/'/g,"")}')">
      <span class="ff-dot ${statusClass(f.overall_status)}"></span>
      <span><span class="ff-tab-name">${esc(f.name)}</span><br><span class="ff-tab-id">${esc(id)} • Zone ${esc(f.zone)}</span></span>
    </button>`;
  }).join("")}</div>`;
}

function dangerBanner(alerts){
  if(!alerts||!alerts.length) return "";
  return `<div class="card danger-banner">
    <div class="label">⚠ DANGER ALERTS</div>
    ${alerts.map(a=>`<div class="danger-row"><span class="pill ${statusClass(a.status)}">${esc(a.status)}</span><strong>${esc(a.name)}</strong> (${esc(a.id)}, Zone ${esc(a.zone)}) — ${esc(a.event_type||"")}</div>`).join("")}
  </div>`;
}

function selectFirefighter(id){
  selectedFirefighterId=id;
  fullRender();
}

function fullRender(){
  const waterFormState=captureWaterForm();
  render();
  restoreWaterForm(waterFormState);
  attachWaterInputListeners();
}

function render(){
  const firefighters=D.firefighters||{};
  const ids=Object.keys(firefighters);

  if(!selectedFirefighterId || !firefighters[selectedFirefighterId]){
    selectedFirefighterId =
      ids.find(id=>firefighters[id].overall_status==="HIGH")
      || ids.find(id=>firefighters[id].overall_status==="ELEVATED")
      || ids[0]
      || null;
  }

  const ff=firefighters[selectedFirefighterId]||{};
  const results=ff.results||[];
  const latest=ff.latest||results[results.length-1]||{};
  const ai=latest.ai_prediction||{}, risk=latest.risk||{}, zone=latest.zone||{};
  const st=String(D.overall_status||"UNKNOWN").toUpperCase(), cls=statusClass(st);
  const stats=ff.window_statistics||{};
  const water=D.truck_water_demand||{};

  currentWaterLevel = String(water.level || "MEDIUM").toUpperCase();
  currentDemandIndex = Number(water.demand_index || 0);
  currentAiFlowLpm = Number(water.estimated_flow_requirement_lpm);
  if (!Number.isFinite(currentAiFlowLpm) || currentAiFlowLpm <= 0) {
    currentAiFlowLpm = 0;
  }

  const markers = ids.map(id=>{
    const f=firefighters[id], pos=f.position||{x:10,y:20};
    const mx=Math.max(6,Math.min(94,Number(pos.x||10)));
    const my=Math.max(6,Math.min(94,100-Number(pos.y||20)));
    const sel=id===selectedFirefighterId?"selected":"";

function captureWaterForm(){
  const ids = [
    "hoseDiameter",
    "hoseLength",
    "nozzleType",
    "nozzleDiameter",
    "elevation",
    "dischargeCoeff",
    "hwC"
  ];

  const state = {};
  let found = false;

  for(const id of ids){
    const el = document.getElementById(id);

    if(el){
      state[id] = el.value;
      found = true;
    }
  }

  return found ? state : null;
}

function restoreWaterForm(state){
  if(!state){
    restoreWaterSettings();
    return;
  }

  for(const [id,value] of Object.entries(state)){
    setFieldValue(id, value);
  }

  updateWaterCalculation();
}

function attachWaterInputListeners(){
  const ids = [
    "hoseDiameter",
    "hoseLength",
    "nozzleType",
    "nozzleDiameter",
    "elevation",
    "dischargeCoeff",
    "hwC"
  ];

  for(const id of ids){
    const el = document.getElementById(id);

    if(el && !el.dataset.listenerAttached){
      // Recalculate live as the value changes (typing a number, or picking
      // a nozzle type) instead of requiring the button click.
      // updateWaterCalculation() also saves the settings internally.
      el.addEventListener("input", updateWaterCalculation);
      el.addEventListener("change", updateWaterCalculation);
      el.dataset.listenerAttached = "1";
    }
  }
}

async function loadLive(){
  const waterFormState = captureWaterForm();

  try{
    let r;

    if(
      location.hostname !== "localhost" &&
      location.hostname !== "127.0.0.1"
    ){
      r = await fetch(
        "/api/latest?ts=" + Date.now(),
        {cache:"no-store"}
      );
    }

    if(!r || !r.ok){
      r = await fetch(
        "/results/live_vnnx_fireground_result.json?ts=" + Date.now(),
        {cache:"no-store"}
      );
    }

    if(!r.ok){
      throw new Error(
        "Live VNNX result file is not available yet."
      );
    }

    D = await r.json();

    // Do NOT rebuild the dashboard while the user is typing
    // in a water-scenario field. Rebuilding the DOM here would
    // interrupt multi-digit input such as 65 or 120.
    const active = document.activeElement;

    const waterInputIds = [
      "hoseDiameter",
      "hoseLength",
      "nozzleType",
      "nozzleDiameter",
      "elevation",
      "dischargeCoeff",
      "hwC"
    ];

    const editingWaterField =
      active && waterInputIds.includes(active.id);

    if(!editingWaterField){

      // Rebuild live dashboard only when the user is not typing.
      render();

      // Restore whatever values the user previously entered.
      restoreWaterForm(waterFormState);

      // Make changes persist for the next visit.
      attachWaterInputListeners();
    }

  }catch(err){

    document.getElementById("app").innerHTML =
      `<div class="card panel">
        <h2>Waiting for live VNNX data</h2>
        <p class="note">${esc(err.message)}</p>
        <p class="note">
          Run the Fireground AI VNNX live pipeline first.
        </p>
      </div>`;
  }
}
loadLive();
setInterval(loadLive, 2000);
